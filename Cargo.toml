[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gmlabs-ch/luma-engine"
homepage = "https://github.com/gmlabs-ch/luma-engine"
authors = ["The Luma Engine authors"]
publish = false

[workspace.dependencies]
luma-archive = { path = "crates/luma-archive" }
luma-formats = { path = "crates/luma-formats" }
luma-script = { path = "crates/luma-script" }
luma-render = { path = "crates/luma-render" }
luma-audio = { path = "crates/luma-audio" }
luma-video = { path = "crates/luma-video" }
luma-adventure = { path = "crates/luma-adventure" }
luma = { path = "crates/luma", default-features = false }

flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "tga"] }
wgpu = { version = "30", default-features = false, features = ["std", "metal", "vulkan", "dx12", "gles", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
pollster = "1"
fontdue = { version = "0.9", default-features = false, features = ["std", "hashbrown"] }
kira = { version = "0.12", default-features = false, features = ["ogg", "vorbis", "wav", "pcm"] }
ogg = { version = "0.9", default-features = false }
oxideav-theora = { version = "0.0.12", default-features = false }
oxideav-core = { version = "0.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
