[package]
name = "luma-adventure"
description = "The adventure layer: actors, scenes, inventory, dialogue, pathfinding and saved games."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
luma-archive.workspace = true
luma-audio.workspace = true
luma-video.workspace = true
luma-formats = { workspace = true, features = ["serde"] }
luma-render.workspace = true
luma-3d = { workspace = true, optional = true, features = ["serde"] }
luma-compiler = { workspace = true, optional = true }
luma-script = { workspace = true, features = ["serde"] }
crc32fast.workspace = true
fontdue.workspace = true
fontdb.workspace = true
flate2.workspace = true
postcard.workspace = true
serde.workspace = true

[features]
## 3D actors on painted backgrounds: the scene geometry, the 3D actor
## type and its scripting, through `luma-3d`.
3d = ["dep:luma-3d"]
## Script files shipped as source text are compiled when they are loaded,
## through `luma-compiler`. Without it such a file does not run.
compiler = ["dep:luma-compiler"]

[dev-dependencies]
luma-compiler.workspace = true

[lints]
workspace = true
