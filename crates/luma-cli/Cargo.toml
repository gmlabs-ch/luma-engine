[package]
name = "luma-cli"
description = "Command-line tools for Luma Engine: inspect and unpack game data, compile scripts, check and play Lumen stories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "luma"
path = "src/main.rs"

[dependencies]
luma-archive.workspace = true
luma-formats.workspace = true
luma-script.workspace = true
luma-compiler.workspace = true
luma = { workspace = true, features = ["lumen"] }

[lints]
workspace = true
