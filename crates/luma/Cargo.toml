[package]
name = "luma"
description = "Luma Engine: the core crates re-exported, with the optional modules a game enables through Cargo features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
luma-archive.workspace = true
luma-formats.workspace = true
luma-script.workspace = true
luma-render.workspace = true
luma-audio.workspace = true
luma-video.workspace = true
luma-adventure = { workspace = true, optional = true }
luma-lumen = { workspace = true, optional = true }
luma-3d = { workspace = true, optional = true }

[features]
default = ["adventure"]
## The adventure module: actors, scenes, speech, inventory, pathfinding
## and saved games (`luma::adventure`).
adventure = ["dep:luma-adventure"]
## Lumen, the scenario format for games made for Luma: parser, checker
## and text runner (`luma::lumen`).
lumen = ["dep:luma-lumen"]
## 3D characters on painted backgrounds: scene geometry, camera mapping
## and the Direct3D conventions of Wintermute's 3D actors
## (`luma::three_d`).
3d = ["dep:luma-3d", "luma-adventure?/3d"]
## Sound output on the default device (needs ALSA on Linux); without it
## the sounds run silently on the game clock.
audio-device = ["luma-audio/device"]
## Serialization of the core's definitions and script engine with serde.
serde = ["luma-formats/serde", "luma-script/serde"]

[lints]
workspace = true
