name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the ALSA headers cpal builds against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The core alone, without the adventure module
        run: cargo check -p luma --no-default-features

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver for the renderer tests and the ALSA headers cpal builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libasound2-dev pkg-config
      - run: cargo test --workspace
        if: runner.os != 'Linux'
      # On the Linux runner the renderer tests draw with Mesa's software
      # Vulkan driver, and their process has died with SIGSEGV now and then
      # (in the offscreen and mesh tests, never in an assertion) while
      # several tests each drove a device of their own at the same time.
      # One test at a time there, until the cause is known.
      - run: cargo test --workspace
        if: runner.os == 'Linux'
        env:
          RUST_TEST_THREADS: 1
      - run: cargo run --bin luma -- version
